name: Probe TradingView history fields

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/probe_tv.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tradingview-screener==3.2.2
      - run: python scripts/probe_tv.py
