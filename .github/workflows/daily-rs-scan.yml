name: Daily RS new-high scan

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rs_new_high_scan.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/daily-rs-scan.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-rs-new-high-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run RS scan
        run: python -u rs_new_high_scan.py

      - name: Commit CSV outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/rs_new_high_tickers.csv outputs/rs_new_high_details.csv outputs/history/
          if ! git diff --cached --quiet; then
            git commit -m "Update RS new-high scan $(date -u +%F)"
            # Rebase if another dashboard or maintenance commit landed during the scan.
            git pull --rebase origin main
            git push
          else
            echo "No output changes to commit."
          fi

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rs-new-high-csvs
          path: |
            outputs/rs_new_high_*.csv
            outputs/history/
          retention-days: 30

  deploy:
    needs: scan
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main (including the newly committed CSVs)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p site/outputs
          cp index.html site/index.html
          cp outputs/rs_new_high_details.csv site/outputs/
          cp outputs/rs_new_high_tickers.csv site/outputs/
          if [ -d outputs/history ]; then cp -R outputs/history site/outputs/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
