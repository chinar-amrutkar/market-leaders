name: Daily RS new-high scan

on:
  schedule:
    # Primary run: after the US cash-market close (UTC).
    - cron: "17 22 * * 1-5"
    # Backup run: catches a missed/delayed primary schedule and retries transient failures.
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rs_new_high_scan.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/daily-rs-scan.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daily-rs-new-high-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Run regression tests
        run: python -m pytest -q

      - name: Run RS scan with automatic retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "RS scan attempt ${attempt}/3"
            if python -u rs_new_high_scan.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 60))
            fi
          done
          echo "RS scan failed after 3 attempts."
          exit 1

      - name: Commit CSV outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/rs_new_high_tickers.csv outputs/rs_new_high_details.csv outputs/history/
          if ! git diff --cached --quiet; then
            git commit -m "Update RS new-high scan $(date -u +%F)"
            git pull --rebase origin main
            git push
          else
            echo "No output changes to commit."
          fi

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rs-new-high-csvs
          path: |
            outputs/rs_new_high_*.csv
            outputs/history/
          retention-days: 30

  deploy:
    needs: scan
    environment:
      name: github-pages
      
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main (including the newly committed CSVs)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p site/outputs
          cp index.html site/index.html
          cp outputs/rs_new_high_details.csv site/outputs/
          cp outputs/rs_new_high_tickers.csv site/outputs/
          if [ -d outputs/history ]; then cp -R outputs/history site/outputs/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages (attempt 1/3)
        id: deployment_attempt_1
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry 2
        if: failure()
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2/3)
        id: deployment_attempt_2
        if: steps.deployment_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry 3
        if: steps.deployment_attempt_2.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (attempt 3/3)
        id: deployment_attempt_3
        if: steps.deployment_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v4

  alert:
    if: ${{ failure() }}
    needs: [scan, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "RS dashboard data refresh failed";
            const body = [
              "The automated RS scan or GitHub Pages deployment failed.",
              "",
              "Please inspect the failed run:",
              `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "The workflow includes three scan attempts and a second scheduled backup run. This issue is the alert that manual investigation is required if both recovery paths fail."
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const match = existing.data.find(issue => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: match.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body
              });
            }
